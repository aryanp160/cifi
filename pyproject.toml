[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cifi"
version = "0.1.0a2"
description = "cifi — Log Intelligence Engine (80% Failure Diagnosis Without AI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aryan Pathak" }
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
cifi = "cifi.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cifi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
